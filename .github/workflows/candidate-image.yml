name: candidate-image

on:
  push:
    branches:
      - codex/native-gemma-schema6
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/cliproxyapi-candidate

jobs:
  build-linux-amd64:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.metadata.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Refresh models catalog
        run: bash .github/scripts/refresh-model-catalogs.sh

      - name: Set image metadata
        id: metadata
        run: |
          echo "image=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "tag=schema6-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Linux amd64 candidate
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.image }}:${{ steps.metadata.outputs.tag }}

      - name: Publish immutable image reference
        run: |
          printf '%s@%s\n' \
            '${{ steps.metadata.outputs.image }}' \
            '${{ steps.build.outputs.digest }}' | tee candidate-image.ref

      - name: Upload immutable image reference
        uses: actions/upload-artifact@v4
        with:
          name: candidate-image-reference
          path: candidate-image.ref
          if-no-files-found: error
